name: Asset request
description: Ask for a new asset to be made for this pack (a stamp, tile, texture, effect, sound, scene…).
labels: ['asset-request']
body:
    - type: markdown
      attributes:
          value: |
              Requests are made as this pack's own art, AI-generated and published under CC0 1.0. Please search the gallery first. If the asset is already one of this pack's own, open it and use its "Request variant" button for the versions it is missing. Assets by other authors are theirs: ask their authors for changes, through the page each asset links to.

              Describe things in plain words. Names, factions or designs owned by a game publisher (trademarked terms, logos, iconic emblems) cannot be drawn or published here, so describe what the thing looks like instead.
    - type: dropdown
      id: class
      attributes:
          label: Kind of asset
          options:
              - Stamp
              - Tile
              - Texture
              - Particle effect
              - Sound effect
              - Scene
              - Something else
      validations:
          required: true
    - type: input
      id: name
      attributes:
          label: Name
          description: A short, plain name for it.
          placeholder: Rope Bridge Anchor
      validations:
          required: true
    - type: textarea
      id: looks
      attributes:
          label: What it looks like
          description: Shape, materials, colours and anything on it, as seen from the perspective you choose below. For a sound, what it sounds like.
          placeholder: A square timber post set in a stone footing, two thick ropes knotted round it and running off one edge.
      validations:
          required: true
    - type: dropdown
      id: perspective
      attributes:
          label: Perspective
          description: How an image is drawn. Straight down suits most maps; the gallery's Perspective (?) shows each with examples.
          options:
              - Straight down (orthographic, as on a floor plan)
              - Isometric (three-quarter view)
              - Front (side elevation)
              - One-point (seen from above, sides converging)
              - Not an image
    - type: textarea
      id: variants
      attributes:
          label: Variants
          description: The states or versions you want, one per line (intact, damaged, open, lit, overgrown…).
          placeholder: |
              intact
              frayed ropes
              snapped, ropes trailing
    - type: dropdown
      id: scale
      attributes:
          label: Scale
          description: The kind of map it is for.
          options:
              - Interior
              - Exterior
              - City
              - Regional
              - Planet
              - System
              - Not a map piece
    - type: dropdown
      id: setting
      attributes:
          label: Setting
          description: Choose every setting it belongs in.
          multiple: true
          options:
              - Fantasy
              - Modern
              - Sci-fi
              - Steampunk
              - Western
              - Grimdark (human)
              - Grimdark (chaotic)
              - Grimdark (undead)
              - Grimdark (elven)
              - Grimdark (orcish)
              - Grimdark (communist)
              - Generic
      validations:
          required: true
    - type: input
      id: category
      attributes:
          label: Category
          description: Where it belongs in the gallery, if you know (Furniture, Lighting, Storage…).
    - type: input
      id: size
      attributes:
          label: Size on the map
          description: Roughly how many 5 ft squares it covers, width by depth.
          placeholder: 1 x 2
    - type: textarea
      id: use
      attributes:
          label: Where you would use it
          description: The kind of map or scene it is for.
    - type: textarea
      id: references
      attributes:
          label: References
          description: Links or images showing the look you want (they guide the description; they are not copied).
    - type: checkboxes
      id: terms
      attributes:
          label: Before you submit
          options:
              - label: I searched the gallery, and this asset is not there yet.
                required: true
              - label: The request names no publisher-owned faction, character, logo or emblem.
                required: true
