# Build the gallery (gallery/) and publish it to GitHub Pages on every push to main that changes it. Its index,
# thumbnails, previews and audio are built locally from the module at the repository root (pnpm index) and committed
# under gallery/public/; until an index is committed there, the site builds but is not deployed.
name: Pages

on:
    push:
        branches: [main]
        paths: ['gallery/**', '.github/workflows/pages.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

defaults:
    run:
        working-directory: gallery

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            ready: ${{ steps.index.outputs.ready }}
        steps:
            - uses: actions/checkout@v4
            - id: index
              name: Is an index committed?
              run: |
                  if [ -f public/stamps.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
            - uses: pnpm/action-setup@v4
              with:
                  package_json_file: gallery/package.json
            - uses: actions/setup-node@v4
              with:
                  node-version-file: gallery/.nvmrc
                  cache: pnpm
                  cache-dependency-path: gallery/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - if: steps.index.outputs.ready == 'true'
              uses: actions/configure-pages@v5
            - if: steps.index.outputs.ready == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: gallery/dist
    deploy:
        needs: build
        if: needs.build.outputs.ready == 'true'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
